.watermark.r{left:auto;right:2%;bottom:8%;transform:scale(.8) rotate(18deg)}

.header{
  position:relative;z-index:20;
  height:86px;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(22px,5vw,78px);
}
.brand-logo{width:clamp(180px,20vw,295px);height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.22))}
.config-trigger{
  height:46px;padding:0 18px;border-radius:999px;
  display:flex;align-items:center;gap:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(11,38,75,.52);color:#fff;font-weight:800;font-size:15px;
  backdrop-filter:blur(12px);cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.17),inset 0 1px 0 rgba(255,255,255,.08);
  transition:.18s ease;
}
.config-trigger:hover{transform:translateY(-1px);background:rgba(20,57,104,.62)}
.config-trigger svg{width:18px;height:18px}

.main{
  position:relative;z-index:5;
  height:calc(100dvh - 86px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 16px 18px;
}
.stage{
  position:relative;
  width:var(--wheel-size);height:var(--wheel-size);
  flex:0 0 var(--wheel-size);
  display:grid;place-items:center;
  filter:drop-shadow(0 34px 42px rgba(0,0,0,.34));
}
.stage::before{
  content:"";position:absolute;z-index:-2;left:50%;bottom:-10%;transform:translateX(-50%);
  width:115%;height:32%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(24,128,255,.26),rgba(255,105,0,.09) 42%,transparent 70%);
  filter:blur(14px);
}
.stage::after{
  content:"";position:absolute;z-index:-3;left:50%;bottom:-13%;transform:translateX(-50%);
  width:145%;height:16%;border-radius:50%;
  border-top:1px solid rgba(255,174,77,.25);
  box-shadow:0 -8px 26px rgba(255,108,0,.13),0 -5px 35px rgba(20,126,255,.16);
}

.outer-glow{
  position:absolute;inset:-15px;border-radius:50%;z-index:1;pointer-events:none;
  background:conic-gradient(from -18deg,
    rgba(255,149,42,.92),rgba(255,217,126,.55),rgba(31,154,255,.88),rgba(86,193,255,.56),
    rgba(255,139,31,.88),rgba(255,210,107,.55),rgba(16,131,255,.92),rgba(84,198,255,.48),rgba(255,149,42,.92));
  filter:blur(5px);opacity:.9;
}
.ring{
  position:absolute;inset:-7px;border-radius:50%;z-index:2;pointer-events:none;
  background:conic-gradient(from -15deg,#f4b64c,#fff2c5,#1f87ff,#d7f1ff,#f1a53a,#fff0b9,#1884ff,#cdeaff,#f4b64c);
  padding:5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.56),0 0 0 2px rgba(5,20,40,.88),0 0 26px rgba(20,126,255,.28);
}
.ring::after{
  content:"";display:block;width:100%;height:100%;border-radius:50%;
  background:#0b2241;
}

.rotor{
  position:absolute;inset:6px;border-radius:50%;z-index:4;will-change:transform;
}
.wheel-disk{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:var(--wheel-gradient);
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.92),
    inset 0 0 50px rgba(0,0,0,.12),
    inset 0 16px 26px rgba(255,255,255,.08);
}
.wheel-disk::before{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 42% 32%,rgba(255,255,255,.15),transparent 28%),radial-gradient(circle at 50% 50%,transparent 46%,rgba(0,0,0,.16) 100%);
  z-index:1;
}
.wheel-disk::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from -22.5deg,rgba(255,255,255,.88) 0 1.2deg,transparent 1.2deg 45deg);
  mix-blend-mode:screen;opacity:.8;z-index:2;
}
.labels{position:absolute;inset:0;z-index:5;pointer-events:none}
.prize-label{
  position:absolute;left:50%;top:50%;
  width:22%;min-width:86px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  text-align:center;line-height:1.05;font-weight:900;
  transform-origin:center center;
  text-shadow:0 2px 8px rgba(0,0,0,.18);
}
.prize-label.light{color:#fff}.prize-label.dark{color:#0b2a52;text-shadow:none}
.prize-icon{width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 3px 7px rgba(0,0,0,.15))}
.prize-icon svg{width:100%;height:100%;display:block}
.prize-text{font-size:clamp(12px,calc(var(--wheel-size)*.028),22px);max-width:100%;word-break:normal}

.studs{position:absolute;inset:0;z-index:9;pointer-events:none}
.stud{
  position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px;
  border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff4c2 0 12%,#ffd36d 25%,#dc9219 72%,#875009 100%);
  box-shadow:0 2px 7px rgba(0,0,0,.35),0 0 8px rgba(255,183,50,.44),inset 0 1px 1px rgba(255,255,255,.62);
}

.hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;
  width:29%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;
  background:
    radial-gradient(circle at 36% 30%,rgba(255,255,255,.18),transparent 27%),
    linear-gradient(180deg,#143d74 0%,#091f3b 100%);
  box-shadow:
    0 14px 32px rgba(0,0,0,.35),
    0 0 0 4px rgba(247,186,71,.84),
    0 0 22px rgba(255,172,49,.34),
    inset 0 -18px 30px rgba(0,0,0,.2);
  display:grid;place-items:center;cursor:pointer;padding:0;overflow:hidden;
  transition:transform .16s ease;
}
.hub:hover{transform:translate(-50%,-50%) scale(1.03)}
.hub:active{transform:translate(-50%,-50%) scale(.985)}
.hub:disabled{cursor:not-allowed;filter:saturate(.65)}
.hub img{width:67%;height:67%;object-fit:contain;display:block;filter:drop-shadow(0 7px 11px rgba(0,0,0,.24))}

.pointer{
  position:absolute;left:50%;top:-31px;transform:translateX(-50%);z-index:30;
  width:78px;height:104px;filter:drop-shadow(0 11px 12px rgba(0,0,0,.42));transform-origin:50% 18%;
}

  -webkit-backface-visibility:hidden;
}

/* Ponteiro: container invisível + uma única peça visual */
.pointer{
  position:absolute !important;
  left:50% !important;
  top:-27px !important;
  width:54px !important;
  height:78px !important;
  transform:translateX(-50%) !important;
  transform-origin:50% 0 !important;
  z-index:30 !important;
  overflow:visible !important;
  background:transparent !important;
  background-image:none !important;
  box-shadow:none !important;
  filter:none !important;
  border:0 !important;
  outline:0 !important;
  clip-path:none !important;
  -webkit-clip-path:none !important;
}
.pointer::before,.pointer::after,
.pointer .cap,.pointer .tip{
  content:none !important;
  display:none !important;
}
.pointer-piece{
  position:absolute;
  inset:0;
  overflow:hidden;
  isolation:isolate;
  transform-origin:50% 12%;
  will-change:transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  -webkit-clip-path:polygon(23% 0%,77% 0%,94% 13%,84% 31%,50% 100%,16% 31%,6% 13%);
  clip-path:polygon(23% 0%,77% 0%,94% 13%,84% 31%,50% 100%,16% 31%,6% 13%);
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.88) 0 10%,transparent 34%),
    linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,241,189,.22) 18%,rgba(255,191,69,.08) 54%,rgba(120,60,0,.16) 100%),
    linear-gradient(90deg,#a86109 0%,#e9a52d 18%,#fff1ad 48%,#efb13b 70%,#9a5705 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -7px 10px rgba(86,44,0,.18);
  filter:drop-shadow(0 9px 11px rgba(0,0,0,.42)) drop-shadow(0 0 7px rgba(255,185,60,.24));
}
.pointer-piece::before,.pointer-piece::after{content:none !important;display:none !important}
.pointer-piece.css-tick{animation:pointerPhysicalMobile .19s cubic-bezier(.18,.7,.28,1)}
@keyframes pointerPhysicalMobile{
  0%{transform:rotate(0deg)}
  30%{transform:rotate(-22deg)}
  55%{transform:rotate(8deg)}
  75%{transform:rotate(-3deg)}
  100%{transform:rotate(0deg)}
}

/* Luzes fixas no aro */
.rim-lights{
  position:absolute !important;
  inset:0 !important;
  z-index:12 !important;
  pointer-events:none !important;
  transform:none !important;
}
.rim-lights .stud{
  position:absolute;
  width:15px !important;
  height:15px !important;
  margin:-7.5px !important;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff 0 10%,#fff3bd 18%,#ffd56b 39%,#e39a20 68%,#84510d 100%) !important;
  border:1px solid rgba(255,236,173,.8);
  box-shadow:0 2px 8px rgba(0,0,0,.38),0 0 5px rgba(255,189,57,.35),inset 0 1px 2px rgba(255,255,255,.8);
  animation:rimLampBlink 1.55s ease-in-out infinite;
}
@keyframes rimLampBlink{
  0%,100%{transform:scale(.88);filter:brightness(.75) saturate(.85);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 4px rgba(255,181,44,.2),inset 0 1px 2px rgba(255,255,255,.65)}
  45%,58%{transform:scale(1.18);filter:brightness(1.42) saturate(1.12);box-shadow:0 2px 8px rgba(0,0,0,.34),0 0 9px rgba(255,215,107,.98),0 0 18px rgba(255,155,20,.6),inset 0 1px 2px rgba(255,255,255,.95)}
}
body.spinning .rim-lights .stud{animation-duration:.72s}
@keyframes rimLampMobileSpin{
  0%,100%{opacity:.48;transform:scale(.88)}
  50%{opacity:1;transform:scale(1.14)}
}

/* Destaque vencedor */
body.win-reveal .stage{animation:stageWinnerPulse .42s ease-in-out infinite alternate}
@keyframes stageWinnerPulse{
  from{filter:drop-shadow(0 34px 42px rgba(0,0,0,.34)) drop-shadow(0 0 14px rgba(255,185,55,.18))}
  to{filter:drop-shadow(0 34px 42px rgba(0,0,0,.34)) drop-shadow(0 0 34px rgba(255,196,58,.48)) drop-shadow(0 0 58px rgba(20,126,255,.2))}
}

/* Crédito */
.developer-credit{
  position:fixed;
  left:50%;
  bottom:max(6px,var(--safe-bottom));
  transform:translateX(-50%);
  z-index:18;
  font-size:11px;
  line-height:1;
  letter-spacing:.02em;
  color:rgba(255,255,255,.42);
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
  text-shadow:0 2px 8px rgba(0,0,0,.25);
}
.developer-credit strong{color:rgba(255,255,255,.64);font-weight:700}

/* Área de toque / feedback */
.hub{isolation:isolate}
.hub::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:transparent;z-index:-1}
.hub,.spin-btn,.config-trigger{transition:transform .14s ease,filter .14s ease,box-shadow .18s ease,background .18s ease}
.hub.touch-press{transform:translateZ(0) scale(.965) !important;filter:brightness(1.06)}
.spin-btn.touch-press,.config-trigger.touch-press{transform:scale(.985) !important}

  body.spinning .ring{

  }
  body.spinning .rim-lights .stud{

  body.mobile-screen.spinning .wheel-disk{

  }
  body.mobile-screen.spinning .prize-label{will-change:auto !important}
  body.mobile-screen.spinning .prize-icon,
  body.mobile-screen.spinning .prize-text{text-shadow:none !important;filter:none !important}
  body.mobile-screen.spinning .outer-glow{animation-play-state:paused !important;filter:blur(5px) !important;opacity:.46 !important}

<script>
const DEFAULT_PRIZES = [
  {label:"Presente especial", type:"gift", chance:14},
  {label:"Almoço especial", type:"food", chance:12},
  {label:"Brinde surpresa", type:"surprise", chance:10},
  {label:"R$ 200", type:"money", chance:8},
  {label:"Presente UNIFAHE", type:"gift", chance:13},
  {label:"Almoço", type:"food", chance:13},
  {label:"R$ 50", type:"money", chance:18},
  {label:"R$ 100", type:"money", chance:12}
];

const COLORS = [
  {bg:"#ff6500", light:"#ff8d2d", dark:"#d94700", fg:"light"},
  {bg:"#087cff", light:"#31a9ff", dark:"#0057c9", fg:"light"},
  {bg:"#f6f8fb", light:"#ffffff", dark:"#d9e0ea", fg:"dark"},
  {bg:"#0a326b", light:"#155093", dark:"#061d42", fg:"light"},
  {bg:"#ff6500", light:"#ff8d2d", dark:"#d94700", fg:"light"},
  {bg:"#087cff", light:"#31a9ff", dark:"#0057c9", fg:"light"},
  {bg:"#f6f8fb", light:"#ffffff", dark:"#d9e0ea", fg:"dark"},
  {bg:"#0a326b", light:"#155093", dark:"#061d42", fg:"light"}
];

const $ = s => document.querySelector(s);
const rotor = $('#rotor'), wheelDisk = $('#wheelDisk'), labels = $('#labels'), studs = $('#studs'), winnerWedge = $('#winnerWedge');
const spinBtn = $('#spinBtn'), hubSpin = $('#hubSpin'), openConfigBtn = $('#openConfig'), pointer = $('#pointer'), pointerPiece = $('#pointerPiece');
const configModal = $('#configModal'), winModal = $('#winModal'), editor = $('#editor');
const suspense = $('#suspense'), lastResult = $('#lastResult'), winPrize = $('#winPrize');
const spinDurationInput = $('#spinDurationInput');
const sellerSelect = $('#sellerSelect'), sellerSelectBox = sellerSelect.closest('.seller-select-box');

let prizes = loadPrizes();
let editorDraft = null;
let rotation = 0;
let spinning = false;
let resultPending = false;
let revealTimer = 0;
let lastBoundaryIndex = null;
const SPIN_DURATION_KEY='unifahe_roleta_spin_duration_seconds_v1';
const DEFAULT_SPIN_DURATION_SECONDS=13;
const MIN_SPIN_DURATION_SECONDS=5;
const MAX_SPIN_DURATION_SECONDS=60;

function sanitizeSpinDuration(value){
  const n=Math.round(Number(value));
  if(!Number.isFinite(n)) return DEFAULT_SPIN_DURATION_SECONDS;
  return Math.min(MAX_SPIN_DURATION_SECONDS,Math.max(MIN_SPIN_DURATION_SECONDS,n));
}
function loadSpinDuration(){
  try{
    const raw=localStorage.getItem(SPIN_DURATION_KEY);
    return raw===null ? DEFAULT_SPIN_DURATION_SECONDS : sanitizeSpinDuration(raw);
  }catch(e){
    return DEFAULT_SPIN_DURATION_SECONDS;
  }
}
function saveSpinDuration(value){
  const clean=sanitizeSpinDuration(value);
  try{localStorage.setItem(SPIN_DURATION_KEY,String(clean))}catch(e){}
  return clean;
}

let spinDurationSeconds=loadSpinDuration();
let spinDurationDraft=spinDurationSeconds;
let currentSpeed = 0;
let currentSeller = '';
let currentRoundSeller = '';

// Ambiente mobile: usado só para otimização de animação e feedback tátil.
const mobileRuntime =
  window.matchMedia('(max-width:900px)').matches ||
  navigator.maxTouchPoints > 0;

if(mobileRuntime) document.body.classList.add('mobile-screen');

const lowPowerRuntime =
  mobileRuntime && (
    (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4) ||
    (typeof navigator.hardwareConcurrency === 'number' && navigator.hardwareConcurrency <= 6)
  );

if(lowPowerRuntime) document.body.classList.add('low-power');

function vibrateSafe(pattern){
  try{
    if(mobileRuntime && navigator.vibrate){
      navigator.vibrate(pattern);
    }
  }catch(e){}
}

function cloneDefaults(){ return DEFAULT_PRIZES.map(p=>({...p})); }
function sanitizePrize(p,index=0){
  const allowedTypes=new Set(['money','gift','food','surprise']);
  const label=String(p?.label ?? `Prêmio ${index+1}`).trim().slice(0,34) || `Prêmio ${index+1}`;
  const type=allowedTypes.has(p?.type) ? p.type : 'surprise';
  const rawChance=Number(p?.chance);
  const chance=Number.isFinite(rawChance) ? Math.min(1000,Math.max(.1,rawChance)) : 1;
  return {label,type,chance};
}
function sanitizePrizeList(list){
  if(!Array.isArray(list)) return cloneDefaults();
  const clean=list.slice(0,12).map(sanitizePrize);
  return clean.length>=2 ? clean : cloneDefaults();
}
function loadPrizes(){
  try{
    const raw=localStorage.getItem('unifahe_roleta_prizes_v3');
    if(!raw) return cloneDefaults();
    return sanitizePrizeList(JSON.parse(raw));
  }catch(e){
    return cloneDefaults();
  }
}
function savePrizesLocal(){
  try{ localStorage.setItem('unifahe_roleta_prizes_v3',JSON.stringify(prizes)); }
  catch(e){ console.warn('Não foi possível salvar a configuração local da roleta.'); }
}
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function normalizeDeg(v){ return ((v%360)+360)%360; }

function iconSvg(type){
  const common='stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  if(type==='money') return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="13" ${common}/><path d="M21.7 13.8c-.9-1-2.2-1.5-3.7-1.5-2 0-3.5 1-3.5 2.6 0 1.8 1.5 2.4 3.8 2.9 2.4.6 3.7 1.3 3.7 3 0 1.8-1.7 3-4 3-1.8 0-3.2-.6-4.2-1.7M18 9.7v16.6" ${common}/></svg>`;

function buildWheel(){
  const n = prizes.length;
  const sector = 360/n;
  const startOffset = -sector/2;
  const stops=[];

  // Todos os stops ficam entre 0° e 360°. A rotação inicial é aplicada
  // no próprio conic-gradient. Isso elimina a emenda visual no setor 0.
  prizes.forEach((p,i)=>{
    const c=COLORS[i%COLORS.length];
    const a=i*sector;
    const b=(i+1)*sector;
    const s1=a+sector*.17;
    const mid=a+sector*.50;
    const s3=a+sector*.83;
    stops.push(
      `${c.dark} ${a}deg`,
      `${c.bg} ${s1}deg`,
      `${c.light} ${mid}deg`,
      `${c.bg} ${s3}deg`,
      `${c.dark} ${b}deg`
    );
  });

  wheelDisk.style.setProperty('--wheel-gradient',`conic-gradient(from ${startOffset}deg, ${stops.join(',')})`);
  wheelDisk.style.setProperty('--sector-angle',`${sector}deg`);
  wheelDisk.style.setProperty('--sector-start',`${startOffset}deg`);

  labels.innerHTML='';
  const rPct = n>9 ? 34.3 : 35.2;
  prizes.forEach((p,i)=>{
    const a = i*sector;
    const rad = (a-90)*Math.PI/180;
    const x = 50 + Math.cos(rad)*rPct;
    const y = 50 + Math.sin(rad)*rPct;
    const c = COLORS[i%COLORS.length];
    const el=document.createElement('div');
    el.className=`prize-label ${c.fg}`;
    el.dataset.angle=a;
    el.style.left=x+'%';
    el.style.top=y+'%';
    el.innerHTML=`<div class="prize-icon">${iconSvg(p.type)}</div><div class="prize-text">${esc(p.label)}</div>`;
    labels.appendChild(el);
  });

  studs.innerHTML='';
  const studCount = Math.max(16, n*2);
  for(let i=0;i<studCount;i++){
    const a=i*(360/studCount);

    // As luzes pertencem ao aro fixo, não ao rotor.
    // 50.2% posiciona o centro das lâmpadas sobre a borda externa metálica.
    const r=50.2;
    const rad=(a-90)*Math.PI/180;
    const x=50+Math.cos(rad)*r;
    const y=50+Math.sin(rad)*r;

    const s=document.createElement('i');
    s.className='stud';
    s.style.left=x+'%';
    s.style.top=y+'%';
    s.style.animationDelay=((i%8)*0.11)+'s';
    studs.appendChild(s);
  }
  syncLabels(rotation);
}

function getPreferredPtVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices=window.speechSynthesis.getVoices()||[];
  return (
    voices.find(v=>/^pt-BR$/i.test(v.lang)) ||
    voices.find(v=>/^pt/i.test(v.lang)) ||
    null
  );
}

function speakText(text,{rate=.95,pitch=1,volume=1}={}){
  if(!text || !('speechSynthesis' in window)) return;

  try{
    window.speechSynthesis.cancel();

    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang='pt-BR';
    utterance.rate=rate;
    utterance.pitch=pitch;
    utterance.volume=volume;

    const voice=getPreferredPtVoice();
    if(voice) utterance.voice=voice;

    window.speechSynthesis.speak(utterance);
  }catch(e){}
}

function prizeLabelForSpeech(label){

    const value=Number(numeric);
    if(Number.isFinite(value)){
      return `${value} reais`;
    }
  }
  return text;
}

function fitLayout(){

function weightedDraw(){
  const weights=prizes.map(p=>Math.max(.01,Number(p.chance)||0));
  const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(let i=0;i<weights.length;i++){ r-=weights[i]; if(r<=0) return i; }
  return weights.length-1;
}
function nearEdgeOffset(sector){
  const near=Math.random()<.78;
  if(!near) return (Math.random()-.5)*sector*.22;
  const side=Math.random()<.5?-1:1;
  const safe=Math.max(2.4,sector*.065);
  return side*(sector/2-safe-Math.random()*Math.max(1,sector*.04));
}
function easeOutQuart(t){ return 1-Math.pow(1-t,4); }
function boundaryIndex(rot){ const sector=360/prizes.length; return Math.floor(normalizeDeg(-rot+sector/2)/sector)%prizes.length; }

function bindTouchFeedback(el){

let pointerAnim=null;
let lastPointerAnimationAt=0;

function pointerTick(speed=0){
  if(!pointerPiece) return;

  const now = performance.now();
  const fast = speed > 700;
  const verySlow = speed < 180;

  // No mobile o ponteiro precisa ser percebido, mas sem criar dezenas
  // de animações simultâneas em alta velocidade.
  const minGap = mobileRuntime
    ? (fast ? 118 : verySlow ? 86 : 102)
    : (fast ? 72 : 54);

  if(now-lastPointerAnimationAt < minGap) return;
  lastPointerAnimationAt = now;

  const angle = verySlow ? -24 : fast ? -15 : -20;
  const rebound = verySlow ? 9 : fast ? 5 : 7;
  const duration = verySlow ? 190 : fast ? 138 : 165;

  if(pointerPiece.animate){
    if(pointerAnim) pointerAnim.cancel();

    pointerAnim = pointerPiece.animate([
      {transform:'rotate(0deg)', offset:0},
      {transform:`rotate(${angle}deg)`, offset:.30},
      {transform:`rotate(${rebound}deg)`, offset:.56},
      {transform:'rotate(-3deg)', offset:.78},
      {transform:'rotate(0deg)', offset:1}
    ],{
      duration,
      easing:'cubic-bezier(.16,.72,.22,1)',
      fill:'none'
    });
  }else{
    pointerPiece.classList.remove('css-tick');
    requestAnimationFrame(()=>{
      pointerPiece.classList.add('css-tick');
      setTimeout(()=>pointerPiece.classList.remove('css-tick'),210);
    });
  }

  if(verySlow) vibrateSafe(10);
}

// Audio synced with wheel speed
let audioCtx=null, noiseSource=null, noiseGain=null, noiseFilter=null;
function ensureAudio(){
  if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return false; audioCtx=new AC(); }
  if(audioCtx.state==='suspended') audioCtx.resume(); return true;
}
function makeNoise(){
  const len=Math.floor(audioCtx.sampleRate*.7),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=buf.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const n=Math.random()*2-1; last=last*.84+n*.16; d[i]=last*.5; } return buf;
}
function startSpinSound(){
  if(!ensureAudio())return; stopSpinSound();
  noiseSource=audioCtx.createBufferSource(); noiseSource.buffer=makeNoise(); noiseSource.loop=true;
  noiseFilter=audioCtx.createBiquadFilter(); noiseFilter.type='bandpass'; noiseFilter.Q.value=.62;
  noiseGain=audioCtx.createGain(); noiseGain.gain.value=.0001;
  noiseSource.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination); noiseSource.start();
}
function updateSpinSound(speed){
  if(!audioCtx||!noiseGain||!noiseFilter)return; const n=Math.min(1,speed/1050);
  noiseGain.gain.setTargetAtTime(.004+n*.026,audioCtx.currentTime,.04); noiseFilter.frequency.setTargetAtTime(260+n*1220,audioCtx.currentTime,.045);
}
function tickSound(speed){
  if(!ensureAudio())return; const now=audioCtx.currentTime,n=Math.min(1,speed/900),o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(520+n*420,now); o.frequency.exponentialRampToValueAtTime(160,now+.028);
  g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.035+n*.03,now+.002); g.gain.exponentialRampToValueAtTime(.0001,now+.04);
  o.connect(g); g.connect(audioCtx.destination); o.start(now); o.stop(now+.045);
}
function stopSpinSound(){
  if(noiseGain&&audioCtx) try{noiseGain.gain.setTargetAtTime(.0001,audioCtx.currentTime,.05)}catch(e){}
  const src=noiseSource; if(src)setTimeout(()=>{try{src.stop()}catch(e){}},130); noiseSource=noiseGain=noiseFilter=null;
}


function showWinnerWedge(index){

  winnerWedge.style.background=`conic-gradient(from 0deg,
    transparent ${start}deg,
    rgba(255,228,143,.12) ${start+edge}deg,
    rgba(255,255,255,.52) ${start+sector*.5}deg,
    rgba(255,211,99,.15) ${end-edge}deg,
    transparent ${end}deg)`;
  winnerWedge.classList.add('show');
}
function hideWinnerWedge(){

}

function spin(){
  if(spinning||resultPending||prizes.length<2) return;

  if(!currentSeller){
    sellerSelectBox.classList.remove('attention');
    void sellerSelectBox.offsetWidth;
    sellerSelectBox.classList.add('attention');
    suspense.textContent='Selecione o vendedor';
    sellerSelect.focus();
    return;
  }

  clearTimeout(revealTimer);
  ensureAudio();
  startSpinSound();
  hideWinnerWedge();
  document.body.classList.remove('win-reveal');
  setSpinning(true);
  suspense.textContent='Girando';

  const winner=weightedDraw();
  const prizeSnapshot={...prizes[winner]};
  const sellerSnapshot=currentSeller;
  currentRoundSeller=sellerSnapshot;
  announceSellerStart(sellerSnapshot);
  const sector=360/prizes.length;
  const offset=nearEdgeOffset(sector);
  const desired=normalizeDeg(-(winner*sector+offset));
  const cur=normalizeDeg(rotation);
  let delta=desired-cur;
  if(delta<0) delta+=360;

  const turns=7+Math.floor(Math.random()*3);
  const startRot=rotation;
  const target=rotation+turns*360+delta;
  const distance=target-startRot;
  // Tempo exato definido em Configurar prêmios.
  const duration=spinDurationSeconds*1000;
  const start=performance.now();

  let prevT=start;
  let prevR=startRot;
  let lastAudioUpdate=start;
  let lastMechanicalTick=start;
  let lastVisualFrame=start-17;
  let s1=false,s2=false,s3=false;
  lastBoundaryIndex=boundaryIndex(startRot);

  function frame(now){
    const t=Math.min(1,(now-start)/duration);
    const e=easeOutQuart(t);
    const calculatedRotation=startRot+distance*e;
    const shouldPaint=!mobileRuntime || (now-lastVisualFrame>=16) || t>=1;

    if(shouldPaint){
      rotation=calculatedRotation;
      rotor.style.transform=`translate3d(0,0,0) rotate(${rotation}deg)`;

      // No mobile, os textos acompanham o setor durante o giro.
      // Ao parar, voltam para a orientação horizontal.
      if(!mobileRuntime) syncLabels(rotation);

      const dt=Math.max(1,now-prevT);
      currentSpeed=Math.abs(rotation-prevR)/(dt/1000);
      prevT=now;
      prevR=rotation;
      lastVisualFrame=now;

      const audioInterval=mobileRuntime?64:28;
      if(now-lastAudioUpdate>=audioInterval){
        updateSpinSound(currentSpeed);
        lastAudioUpdate=now;
      }

      const bi=boundaryIndex(rotation);
      if(bi!==lastBoundaryIndex){
        // Uma única camada controla a frequência visual do ponteiro.
        pointerTick(currentSpeed);

        const audioGap=mobileRuntime
          ? (currentSpeed>900?110:currentSpeed>550?82:currentSpeed>280?55:0)
          : (currentSpeed>1200?20:0);

        if(now-lastMechanicalTick>=audioGap){
          tickSound(currentSpeed);
          lastMechanicalTick=now;
        }
        lastBoundaryIndex=bi;
      }
    }else{
      rotation=calculatedRotation;
    }

    if(t>.66&&!s1){s1=true;suspense.textContent='Diminuindo'}
    if(t>.82&&!s2){s2=true;suspense.textContent='Quase parando'}
    if(t>.92&&!s3){s3=true;suspense.textContent='...'}

    if(t<1) requestAnimationFrame(frame);
    else finish();
  }

  function finish(){
    rotation=target;
    rotor.style.transform=`translate3d(0,0,0) rotate(${rotation}deg)`;
    syncLabels(rotation);
    updateSpinSound(0);
    stopSpinSound();
    suspense.textContent='';

    lastResult.innerHTML=`Último prêmio: <strong>${esc(prizeSnapshot.label)}</strong>`;

    // A roleta já parou, mas a interface fica bloqueada durante os 3s
    // de destaque para impedir um segundo giro e resultados concorrentes.
    setResultPending(true);
    setSpinning(false);
    showWinnerWedge(winner);
    document.body.classList.add('win-reveal');

    revealTimer=setTimeout(()=>{
      document.body.classList.remove('win-reveal');
      hideWinnerWedge();
      setResultPending(false);
      showWin(prizeSnapshot,sellerSnapshot);
    },3000);
  }

  requestAnimationFrame(frame);
}


let applauseTimers=[];
let applauseActive=false;

function stopApplause(){
  applauseActive=false;
  applauseTimers.forEach(clearTimeout);
  applauseTimers=[];
}

function playSingleClap(intensity=.7){
  if(!audioCtx || !soundEnabled) return;

  const now=audioCtx.currentTime;
  const duration=.085 + Math.random()*.045;

  const buffer=audioCtx.createBuffer(
    1,
    Math.floor(audioCtx.sampleRate*duration),
    audioCtx.sampleRate
  );
  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    const t=i/data.length;
    const envelope=Math.pow(1-t,3.4);
    data[i]=(Math.random()*2-1)*envelope;
  }

  const src=audioCtx.createBufferSource();
  const band=audioCtx.createBiquadFilter();
  const high=audioCtx.createBiquadFilter();
  const gain=audioCtx.createGain();

  band.type='bandpass';
  band.frequency.value=1150 + Math.random()*950;
  band.Q.value=.8 + Math.random()*.6;

  high.type='highpass';
  high.frequency.value=480 + Math.random()*220;

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.11*intensity,now+.004);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  src.buffer=buffer;
  src.connect(band);
  band.connect(high);
  high.connect(gain);

  if(masterGain) gain.connect(masterGain);
  else gain.connect(audioCtx.destination);

  src.start(now);
  src.stop(now+duration+.02);

  // Pequena segunda reflexão para deixar a palma menos "seca".
  if(Math.random()>.35){
    const src2=audioCtx.createBufferSource();
    const g2=audioCtx.createGain();
    src2.buffer=buffer;
    g2.gain.setValueAtTime(.0001,now+.035);
    g2.gain.exponentialRampToValueAtTime(.035*intensity,now+.043);
    g2.gain.exponentialRampToValueAtTime(.0001,now+.11);
    src2.connect(g2);
    if(masterGain) g2.connect(masterGain);
    else g2.connect(audioCtx.destination);
    src2.start(now+.035);
    src2.stop(now+.14);
  }
}

function playApplause(durationMs=8000){
  stopApplause();
  if(!ensureAudio()) return;

  applauseActive=true;
  const started=performance.now();

  function scheduleBurst(){
    if(!applauseActive) return;

    const elapsed=performance.now()-started;
    if(elapsed>=durationMs){
      stopApplause();
      return;
    }

    // Grupo irregular de palmas para parecer várias pessoas,
    // sem ritmo mecânico repetitivo.
    const people=3+Math.floor(Math.random()*4);
    for(let i=0;i<people;i++){
      const delay=Math.random()*90;
      const timer=setTimeout(()=>{
        if(applauseActive){
          const fade=1-Math.max(0,(elapsed-(durationMs-1800))/1800)*.45;
          playSingleClap((.48+Math.random()*.42)*fade);
        }
      },delay);
      applauseTimers.push(timer);
    }

    const next=105+Math.random()*95;
    const timer=setTimeout(scheduleBurst,next);
    applauseTimers.push(timer);
  }

  scheduleBurst();

  const stopTimer=setTimeout(stopApplause,durationMs+120);
  applauseTimers.push(stopTimer);
}

const confettiCanvas=$('#confetti'),cctx=confettiCanvas.getContext('2d');let particles=[],confettiRAF=0;
function resizeConfetti(){

  const dpr=Math.min(window.devicePixelRatio||1,2);

function burstConfetti(){
  particles=[];
  const colors=['#ff6a00','#ffd15e','#0878ff','#56b9ff','#ffffff'];
  const total=mobileRuntime?(lowPowerRuntime?72:110):150;
  const cx=innerWidth/2,cy=innerHeight*.35;

  for(let i=0;i<total;i++){
    particles.push({
      x:cx+(Math.random()-.5)*90,
      y:cy+(Math.random()-.5)*35,
      vx:(Math.random()-.5)*(mobileRuntime?11:13),
      vy:-4-Math.random()*(mobileRuntime?8:10),
      g:.22+Math.random()*.12,
      r:Math.random()*360,
      vr:(Math.random()-.5)*18,
      w:(mobileRuntime?6:5)+Math.random()*6,
      h:(mobileRuntime?10:9)+Math.random()*9,
      c:colors[i%colors.length],
      life:(mobileRuntime?72:80)+Math.random()*(mobileRuntime?36:45)
    });
  }
  cancelAnimationFrame(confettiRAF);
  animateConfetti();
}
function animateConfetti(){
  cctx.clearRect(0,0,innerWidth,innerHeight); let alive=false;
  for(const p of particles){if(p.life<=0)continue;alive=true;p.life--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.r*Math.PI/180);cctx.fillStyle=p.c;cctx.globalAlpha=Math.min(1,p.life/24);cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cctx.restore();}
  if(alive) confettiRAF=requestAnimationFrame(animateConfetti); else cctx.clearRect(0,0,innerWidth,innerHeight);
}

  editorDraft=prizes.map(p=>({...p}));
  spinDurationDraft=spinDurationSeconds;
  spinDurationInput.value=spinDurationDraft;
  renderEditor();
  configModal.classList.add('show');
  configModal.setAttribute('aria-hidden','false');
};

$('#closeConfig').onclick=()=>{
  editorDraft=null;
  configModal.classList.remove('show');
  configModal.setAttribute('aria-hidden','true');
};

configModal.addEventListener('click',e=>{if(e.target===configModal) $('#closeConfig').click()});
editor.addEventListener('input',updateTotal);

spinDurationInput.addEventListener('input',()=>{
  spinDurationDraft=sanitizeSpinDuration(spinDurationInput.value);
});
spinDurationInput.addEventListener('blur',()=>{
  spinDurationDraft=sanitizeSpinDuration(spinDurationInput.value);
  spinDurationInput.value=spinDurationDraft;
});

editor.addEventListener('click',e=>{
  if(e.target.dataset.remove===undefined || editor.children.length<=2) return;
  editorDraft=collectEditor();
  editorDraft.splice(Number(e.target.dataset.remove),1);
  renderEditor();
});

$('#addPrize').onclick=()=>{
  editorDraft=collectEditor();
  if(editorDraft.length>=12) return;
  editorDraft.push({label:'Novo prêmio',type:'surprise',chance:10});
  renderEditor();
};

$('#resetPrizes').onclick=()=>{
  editorDraft=cloneDefaults();
  renderEditor();
};

$('#savePrizes').onclick=()=>{
  const next=sanitizePrizeList(collectEditor());
  if(next.length<2) return;
  prizes=next;
  spinDurationSeconds=saveSpinDuration(spinDurationDraft);
  savePrizesLocal();
  buildWheel();
  $('#closeConfig').click();
};

$('#closeWin').onclick=()=>{
  if(!winModal.classList.contains('show')) return;
  winModal.classList.remove('show');
  winModal.setAttribute('aria-hidden','true');
  document.body.classList.remove('celebrate','win-reveal');
  hideWinnerWedge();
  cctx.clearRect(0,0,innerWidth,innerHeight);
  stopApplause();

  currentSeller='';
  currentRoundSeller='';
  sellerSelect.value='';
  sellerSelectBox.classList.remove('selected');
  updateInteractionState();
};

winModal.addEventListener('click',e=>{if(e.target===winModal) $('#closeWin').click()});
bindTouchFeedback(spinBtn);
bindTouchFeedback(hubSpin);
bindTouchFeedback(openConfigBtn);
spinBtn.onclick=spin;
hubSpin.onclick=spin;

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!configModal.classList.contains('show')&&!winModal.classList.contains('show')&&!resultPending){
    e.preventDefault();
    spin();
  }
  if(e.key==='Escape'){
    if(configModal.classList.contains('show')) $('#closeConfig').click();
    if(winModal.classList.contains('show')) $('#closeWin').click();
  }
});

let resizeRAF=0;
function handleViewportResize(){
  cancelAnimationFrame(resizeRAF);
  resizeRAF=requestAnimationFrame(()=>{
    fitLayout();
    resizeConfetti();
  });
}
window.addEventListener('resize',handleViewportResize,{passive:true});

spinDurationInput.value=spinDurationSeconds;
fitLayout();
buildWheel();
updateSellerSelection();
updateInteractionState();
</script>

<div class="developer-credit" aria-label="Crédito do desenvolvedor">
  Desenvolvido por <strong>Cauê Galates</strong>
</div>

</body>
